
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Study Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Welcome Back</h1>
            <p class="text-slate-500 mt-2">Login to continue learning.</p>
        </div>

        {% if message %}
        <div class="mb-4 p-3 rounded-lg text-sm
            {% if message_type == 'success' %}
                bg-green-100 text-green-700
            {% else %}
                bg-red-100 text-red-700
            {% endif %}">
            {{ message }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">

            <div>
                <label class="block text-sm font-medium mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Enter your email">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Enter your password">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                Login
            </button>

        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Don't have an account?
            <a href="/register" class="text-blue-600 font-semibold hover:underline">
                Create Account
            </a>
        </p>

    </div>

</body>
</html>
